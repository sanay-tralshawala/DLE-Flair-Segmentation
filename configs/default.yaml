# configs/default.yaml
# Shared default configuration for all FLAIR segmentation experiments.
# Model-specific YAMLs override only the fields that differ.

experiment:
  name: default_experiment
  seed: 42
  output_dir: outputs

data:
  train_csv: data/processed/splits/train.csv
  val_csv: data/processed/splits/val.csv
  test_csv: data/processed/splits/test.csv
  class_map: data/processed/class_map.json
  train_stats: data/processed/train_stats.json

  image_size: 512
  batch_size: 8
  num_workers: 0

  # FLAIR base code reads 1-indexed raster bands; use all five source channels.
  channels: [1, 2, 3, 4, 5]
  norm_type: scaling # options: scaling, custom, without
  norm_means: []
  norm_stds: []
  ignore_index: 255 # set mask to ignore bad masks (if they exist, standard behavior)

  augment:
    enabled: true
    horizontal_flip: true
    vertical_flip: true
    random_rotate_90: true

model:
  name: null # options: resnet34_unet, convnext_tiny, dinov3_convnext_tiny
  encoder: null # options: resnet34, convnext_tiny, dinov3_convnext_tiny
  pretrained: true
  in_channels: 5

training:
  max_epochs: 100
  min_epochs: 15

  warmup_frozen_epochs: 3

  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min # options: min, max
    patience: 10
    min_delta: 0.001

  optimizer:
    name: adamw # options: adam, adamw
    backbone_lr: 0.00001
    head_lr: 0.0001
    weight_decay: 0.0001

  scheduler:
    enabled: true
    name: reduce_on_plateau # options: cosine, reduce_on_plateau
    mode: min # reduce_on_plateau only; options: min, max
    factor: 0.8 # reduce_on_plateau only; multiply LR by this factor on plateau
    patience: 10 # reduce_on_plateau only; epochs without improvement before reducing LR
    threshold: 0.0001 # reduce_on_plateau only; minimum meaningful monitor change
    min_lr: 0.0 # reduce_on_plateau only; lower bound for each learning rate

  loss:
    name: cross_entropy # options: cross_entropy, weight_cross_entropy
    class_weights: []

checkpoint:
  monitor: val_loss
  mode: min # options: min, max
  save_last: true
  save_best: true

wandb:
  enabled: false
  project: DLE-Flair-Segmentation
  entity: null
  group: flair-toy
  job_type: train # options: train
  tags:
    - flair
    - segmentation
  log_model: true
  include_images: true
