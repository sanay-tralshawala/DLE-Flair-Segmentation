# configs/resnet34_unet.yaml

defaults:
  - default.yaml

experiment:
  name: resnet34_unet

model:
  name: resnet34_unet
  encoder: resnet34
  pretrained: true
  num_classes: 5

training:
  max_epochs: 80
  min_epochs: 10
  warmup_frozen_epochs: 3

  early_stopping:
    patience: 8

  optimizer:
    backbone_lr: 0.00003
    head_lr: 0.0003
    weight_decay: 0.0001

wandb:
  tags:
    - flair
    - segmentation
    - baseline
    - resnet34
    - unet
