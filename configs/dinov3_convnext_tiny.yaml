# configs/dinov3_convnext_tiny.yaml

defaults:
  - default.yaml

experiment:
  name: dinov3_convnext_tiny

model:
  name: dinov3_convnext_tiny
  encoder: dinov3_convnext_tiny
  pretrained: true

training:
  max_epochs: 120
  min_epochs: 15
  warmup_frozen_epochs: 5

  early_stopping:
    patience: 12

  optimizer:
    backbone_lr: 0.000005
    head_lr: 0.0001
    weight_decay: 0.0001

wandb:
  tags:
    - flair
    - segmentation
    - dinov3
    - convnext
    - tiny
    - ssl
