# configs/convnext_tiny.yaml

defaults:
  - default.yaml

experiment:
  name: convnext_tiny_3ch

data:
  image_size: 512
  batch_size: 8
  num_workers: 0
  channels: [1, 2, 3]

model:
  name: convnext_tiny
  encoder: convnext_tiny
  pretrained: true
  in_channels: 3

checkpoint:
  monitor: val_loss
  mode: max # options: min, max
  save_last: true
  save_best: true

training:
  max_epochs: 150
  min_epochs: 10
  warmup_frozen_epochs: 3

  early_stopping:
    enabled: true
    monitor: val_IoU
    mode: max # options: min, max
    patience: 20
    min_delta: 0.0001

  optimizer:
    name: adamw # options: adam, adamw
    backbone_lr: 0.00001
    head_lr: 0.001
    weight_decay: 0.0001

  scheduler:
    enabled: true
    name: reduce_on_plateau      # options: cosine, reduce_on_plateau

    mode: min         # reduce_on_plateau only; options: min, max
    factor: 0.9       # reduce_on_plateau only; multiply LR by this factor on plateau
    patience: 10      # reduce_on_plateau only; epochs without improvement before reducing LR
    threshold: 0.0003 # reduce_on_plateau only; minimum meaningful monitor change
    min_lr: 0.0       # reduce_on_plateau only; lower bound for each learning rate

  loss:
    name: weight_cross_entropy # options: cross_entropy, weight_cross_entropy
    # Derived from data/processed/train_stats.json using mean-normalized sqrt inverse pixel frequency:
    # raw_weight_c = 1 / sqrt(class_pixel_percent_c), then scaled so mean(class_weights) = 1.
    class_weights: [0.5805, 1.5472, 0.6807, 0.9176, 0.7746, 1.4995]

wandb:
  enabled: true
  log_model: true
  include_images: true
  tags:
    - flair
    - segmentation
    - convnext
    - tiny
