# configs/dinov3_convnext_tiny.yaml

defaults:
  - default.yaml

experiment:
  name: dinov3_convnext_tiny_3ch

data:
  image_size: 512
  batch_size: 8
  channels: [1, 2, 3]

model:
  name: dinov3_convnext_tiny
  encoder: dinov3_convnext_tiny
  pretrained: true
  in_channels: 3

training:
  max_epochs: 120
  min_epochs: 15
  warmup_frozen_epochs: 10

  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min # options: min, max
    patience: 15
    min_delta: 0.0005

  optimizer:
    name: adamw # options: adam, adamw
    backbone_lr: 0.00001
    head_lr: 0.001
    weight_decay: 0.0001

  scheduler:
    enabled: true
    name: cosine # options: cosine, reduce_on_plateau
    mode: min # reduce_on_plateau only; options: min, max
    factor: 0.6 # reduce_on_plateau only; multiply LR by this factor on plateau
    patience: 10 # reduce_on_plateau only; epochs without improvement before reducing LR
    threshold: 0.0001 # reduce_on_plateau only; minimum meaningful monitor change
    min_lr: 0.0 # reduce_on_plateau only; lower bound for each learning rate

checkpoint:
  monitor: val_loss
  mode: min # options: min, max
  save_last: true
  save_best: true

wandb:
  enabled: true
  project: DLE-Flair-Segmentation
  entity: null
  group: flair-toy
  job_type: train # options: train
  tags:
    - flair
    - segmentation
    - dinov3
    - convnext
    - tiny
    - ssl
