# configs/convnext_tiny.yaml

defaults:
  - default.yaml

experiment:
  name: convnext_tiny

data:
  image_size: 512
  batch_size: 12
  num_workers: 0

model:
  name: convnext_tiny
  encoder: convnext_tiny
  pretrained: true

training:
  max_epochs: 150
  min_epochs: 10
  warmup_frozen_epochs: 3

  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min # options: min, max
    patience: 20
    min_delta: 0.0001

  optimizer:
    name: adamw # options: adam, adamw
    backbone_lr: 0.00003
    head_lr: 0.001
    weight_decay: 0.0001

  scheduler:
    enabled: false
    name: reduce_on_plateau      # options: cosine, reduce_on_plateau

    mode: min         # reduce_on_plateau only; options: min, max
    factor: 0.8       # reduce_on_plateau only; multiply LR by this factor on plateau
    patience: 10      # reduce_on_plateau only; epochs without improvement before reducing LR
    threshold: 0.0003 # reduce_on_plateau only; minimum meaningful monitor change
    min_lr: 0.0       # reduce_on_plateau only; lower bound for each learning rate

  loss:
    name: cross_entropy # options: cross_entropy, weight_cross_entropy
    class_weights: []

wandb:
  enabled: true
  log_model: true
  include_images: true
  tags:
    - flair
    - segmentation
    - convnext
    - tiny
