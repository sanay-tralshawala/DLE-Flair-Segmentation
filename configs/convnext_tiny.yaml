# configs/convnext_tiny.yaml

defaults:
  - default.yaml

experiment:
  name: convnext_tiny

model:
  name: convnext_tiny
  encoder: convnext_tiny
  pretrained: true
  num_classes: 13

training:
  max_epochs: 100
  min_epochs: 10
  warmup_frozen_epochs: 3

  early_stopping:
    patience: 10

  optimizer:
    backbone_lr: 0.00001
    head_lr: 0.0001
    weight_decay: 0.0001

wandb:
  tags:
    - flair
    - segmentation
    - convnext
    - tiny